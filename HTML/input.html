<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Tags</title>
</head>
<body>
    
<input  placeholder = "Write Your Name"    type="text"> // Input Placeholder = “-----------যা লিখবো তাই বক্সের ভিতরে দেখাবে —-------”

Here are the different input types you can use in HTML:

<input type="button">
<input type="checkbox">
<input type="color">
<input type="date">
<input type="datetime-local">
<input type="email">
<input type="file">
<input type="hidden">
<input type="image">
<input type="month">
<input type="number">
<input type="password">
<input type="radio">
<input type="range">
<input type="reset">
<input type="search">
<input type="submit">
<input type="tel">
<input type="text">
<input type="time">
<input type="url">
<input type="week">

<hr>

<input type="email" name="email" id="iddd">


<hr>

<label for="Select Version">Select Version:</label>
<select name="Select Version" id="Select Version">

    <option value="V1">V1</option>
    <option value="V2">V2</option>
    <option value="V3">V3</option>
</select>

<hr>

<label for="cars">Choose a car:</label>

<select name="cars" id="cars">
  <option value="volvo">Volvo</option>
  <option value="saab">Saab</option>
  <option value="mercedes">Mercedes</option>
  <option value="audi">Audi</option>
</select>

</body>
</html>
